<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sip Check">
<title>Sip Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --lake: #0E3B5C; --water: #3FA7D6; --mist: #EAF5FB; --glass: #FFFFFF;
    --pebble: #5E6E79; --ok: #1F8A5B; --warn: #B4542C;
    --bg: var(--mist); --ink: var(--lake); --card: var(--glass);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #081C2B; --ink: #DCEFF9; --card: #0F2A3F; --pebble: #8FA3B0; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 420px; margin: 0 auto; padding: 20px 22px 40px; }
  h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0 0; }
  .sub { color: var(--pebble); margin: 4px 0 18px; }

  .glass-wrap { display: flex; align-items: flex-end; gap: 18px; margin: 10px 0 22px; }
  svg.glass { width: 130px; height: 170px; flex: none; }
  .count { font-size: 3.6rem; font-weight: 800; line-height: 1; }
  .count small { font-size: 1.2rem; color: var(--pebble); font-weight: 500; }
  #water { transition: y .8s ease, height .8s ease; }

  .snap {
    display: block; text-align: center; background: var(--water); color: #fff;
    font-size: 1.25rem; font-weight: 800; padding: 18px; border-radius: 999px;
    cursor: pointer; user-select: none;
  }
  .snap.alt { background: transparent; color: var(--water); border: 3px solid var(--water); margin-top: 12px; padding: 15px; }
  .snap.off { opacity: .45; pointer-events: none; }
  .snap:focus-within { outline: 3px solid var(--ink); outline-offset: 3px; }
  #result { min-height: 1.5em; margin: 14px 4px; font-weight: 500; font-size: 1.15rem; text-align: center; }
  #result.ok { color: var(--ok); } #result.no { color: var(--warn); }
  #preview { width: 100%; border-radius: 14px; display: block; margin-bottom: 12px; }
  button.snap { width: 100%; border: 0; font-family: inherit; }

  .stats { display: flex; gap: 12px; margin: 8px 0 20px; }
  .stats div { flex: 1; background: var(--card); border-radius: 14px; padding: 14px; }
  .stats b { display: block; font-size: 1.5rem; }
  .stats span { color: var(--pebble); font-size: .9rem; }

  ul { list-style: none; padding: 0; margin: 0 0 20px; color: var(--pebble); }
  li { padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--pebble) 25%, transparent); }
  h2 { font-size: 1.4rem; margin: 26px 0 6px; }
  h3 { font-size: 1rem; font-weight: 500; color: var(--pebble); margin: 16px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid button { position: relative; padding: 0; border: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--card); cursor: pointer; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid span { position: absolute; left: 6px; bottom: 5px; font: 500 .75rem inherit; color: #fff; text-shadow: 0 1px 3px #000a; }
  #history { margin-bottom: 24px; }
  #viewer { position: fixed; inset: 0; background: #000e; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; cursor: pointer; }
  #viewer img { max-width: 100%; max-height: 80%; border-radius: 14px; }
  #viewer p { color: #fff; margin-top: 12px; }
  details { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  summary { cursor: pointer; font-weight: 500; }
  label.row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  input[type=number] { width: 70px; font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--pebble); background: transparent; color: var(--ink); }
  button.link { background: none; border: 0; color: var(--warn); font: inherit; padding: 12px 0 0; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Sip Check</h1>
  <p class="sub" id="date"></p>

  <div class="glass-wrap">
    <svg class="glass" viewBox="0 0 130 170" aria-hidden="true">
      <defs><clipPath id="cup"><path d="M12 8 H118 L104 162 H26 Z"/></clipPath></defs>
      <rect id="water" x="0" y="170" width="130" height="0" fill="var(--water)" clip-path="url(#cup)"/>
      <path d="M12 8 H118 L104 162 H26 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="count"><span id="today">0</span><small> / <span id="goalShow">8</span></small></div>
      <div class="sub" style="margin:6px 0 0">drinks today</div>
    </div>
  </div>

  <label class="snap" id="snap">
    📸 Snap your water
    <input type="file" accept="image/*" capture="environment" id="cam" hidden>
  </label>

  <div id="review" hidden>
    <img id="preview" alt="Your photo">
    <button class="snap" id="send">Send it 💧</button>
    <label class="snap alt">
      Retake
      <input type="file" accept="image/*" capture="environment" id="retake" hidden>
    </label>
  </div>
  <p id="result" role="status"></p>

  <div class="stats">
    <div><b id="streak">0</b><span>day streak</span></div>
    <div><b id="last">None yet</b><span>last drink</span></div>
  </div>

  <section id="history">
    <h2>History</h2>
    <div id="days"><p class="sub">Your photos will show up here.</p></div>
  </section>

  <div id="viewer" hidden>
    <img id="big" alt="">
    <p id="bigTime"></p>
  </div>

  <details>
    <summary>Settings</summary>
    <label class="row">Daily goal (drinks)
      <input type="number" id="goal" min="1" max="20">
    </label>
    <button class="link" id="undo">Remove last drink</button>
  </details>
</main>

<script>
// ===== EDIT THESE =====
const NTFY_TOPIC = "sipcheck-romaan-k82mz"; // make this random, it works like a password
const FRIEND_NAME = "Saira";                       // shows up in your notification
const SEND_PHOTO = true;                        // false = text only, no photo attached
// ======================

const KEY = "sipcheck.v1";
const $ = id => document.getElementById(id);

let state = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { goal: 8, log: [] }; }
  catch { return { goal: 8, log: [] }; }
}
function save() {
  const cutoff = Date.now() - 60 * 864e5; // keep 60 days
  state.log = state.log.filter(t => t > cutoff);
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

const dayKey = t => new Date(t).toLocaleDateString("en-CA");
const timeStr = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const todays = () => state.log.filter(t => dayKey(t) === dayKey(Date.now()));

function streak() {
  const counts = {};
  state.log.forEach(t => { const k = dayKey(t); counts[k] = (counts[k] || 0) + 1; });
  const d = new Date();
  if ((counts[dayKey(d)] || 0) < state.goal) d.setDate(d.getDate() - 1); // today still in progress
  let s = 0;
  while ((counts[dayKey(d)] || 0) >= state.goal) { s++; d.setDate(d.getDate() - 1); }
  return s;
}

function render() {
  const t = todays();
  $("date").textContent = new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  $("today").textContent = t.length;
  $("goalShow").textContent = state.goal;
  $("goal").value = state.goal;
  $("streak").textContent = streak();
  $("last").textContent = t.length ? timeStr(t[t.length - 1]) : "None yet";

  const fill = Math.min(t.length / state.goal, 1) * 154; // 154 = inside height of the glass
  $("water").setAttribute("y", 162 - fill);
  $("water").setAttribute("height", fill);
}

function shrink(img, max = 640) {
  const scale = Math.min(1, max / Math.max((img.naturalWidth || img.width), (img.naturalHeight || img.height)));
  const c = document.createElement("canvas");
  c.width = Math.round((img.naturalWidth || img.width) * scale);
  c.height = Math.round((img.naturalHeight || img.height) * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}

async function notify(canvas) {
  const n = todays().length;
  const headers = {
    "Title": "Sip Check",
    "Message": `${FRIEND_NAME} logged drink ${n} of ${state.goal} at ${timeStr(Date.now())}`,
    "Tags": "droplet"
  };
  try {
    if (SEND_PHOTO) {
      const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.7));
      headers["Filename"] = "water.jpg";
      await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, { method: "PUT", body: blob, headers });
    } else {
      await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, { method: "POST", body: headers.Message, headers: { Title: headers.Title, Tags: headers.Tags } });
    }
    return true;
  } catch { return false; }
}

const SAYINGS = [
  "Hydration station: fully operational. 💧",
  "Your kidneys just sent you a thank you card.",
  "Look at you, thriving like a well watered houseplant. 🪴",
  "Certified hydrated. The Hydro Flask is proud.",
  "One sip closer to glowing. ✨",
  "Your cells are doing a little happy dance right now.",
  "Water you doing? Winning, apparently.",
  "Absolute legend behavior.",
  "Somewhere out there, a camel is jealous. 🐪",
  "Hydrated and dangerous.",
  "You're making every other water bottle look bad.",
  "Sip sip hooray! 🎉",
  "Your skin just whispered thank you.",
  "Main character hydration arc. Keep it going.",
  "The ocean called. It says you're doing amazing. 🌊",
  "Keep this up and you'll turn into a mermaid. 🧜‍♀️",
  "That's the good stuff. Literally, it's water.",
  "H2Oh yeah.",
  "Plants wish they had your discipline.",
  "Level up! +10 hydration. 🎮",
  "Future you is high fiving you right now. 🙌",
  "Hydration queen, as usual. 👑",
  "Another one! Don't let that streak dry up.",
  "Not all heroes wear capes. Some carry Hydro Flasks. 🦸‍♀️",
  "Drip check: passed. 💧",
  "You're on a roll. A wet, healthy roll.",
  "Your brain just got a tiny bit sharper. That's science. 🧠",
  "Dehydration could never.",
  "Olympic level water drinking. Gold medal. 🥇",
  "Moisturized. Unbothered. Iconic. 💅"
];
let bag = [];
function nextSaying() {
  if (!bag.length) bag = SAYINGS.map((_, i) => i).sort(() => Math.random() - 0.5); // no repeats until all 30 are used
  return SAYINGS[bag.pop()];
}

let photo = null;

// photos live in IndexedDB on her phone (too big for localStorage)
const dbReady = new Promise((res, rej) => {
  const r = indexedDB.open("sipcheck", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "t" });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function tx(mode, fn) {
  const db = await dbReady;
  return new Promise((res, rej) => {
    const t = db.transaction("photos", mode);
    const out = fn(t.objectStore("photos"));
    t.oncomplete = () => res(out && out.result);
    t.onerror = () => rej(t.error);
  });
}
const savePhoto = (t, blob) => tx("readwrite", st => st.put({ t, blob })).catch(() => {});
const deletePhoto = t => tx("readwrite", st => st.delete(t)).catch(() => {});
const allPhotos = () => tx("readonly", st => st.getAll()).catch(() => []);

let urls = [];
async function renderHistory() {
  const photos = (await allPhotos()) || [];
  urls.forEach(u => URL.revokeObjectURL(u)); urls = [];
  if (!photos.length) return;
  photos.sort((a, b) => b.t - a.t);
  const byDay = {};
  photos.forEach(p => (byDay[dayKey(p.t)] ||= []).push(p));
  const box = $("days");
  box.innerHTML = "";
  for (const k of Object.keys(byDay)) {
    const h = document.createElement("h3");
    h.textContent = new Date(byDay[k][0].t).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }) + `  (${byDay[k].length})`;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const p of byDay[k]) {
      const u = URL.createObjectURL(p.blob); urls.push(u);
      const b = document.createElement("button");
      b.innerHTML = `<img src="${u}" alt="Drink at ${timeStr(p.t)}"><span>${timeStr(p.t)}</span>`;
      b.onclick = () => {
        $("big").src = u;
        $("bigTime").textContent = new Date(p.t).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
        $("viewer").hidden = false;
      };
      grid.appendChild(b);
    }
    box.append(h, grid);
  }
}
$("viewer").addEventListener("click", () => $("viewer").hidden = true);

async function takePhoto(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const img = $("preview");
  img.src = URL.createObjectURL(file);
  try {
    await img.decode();
    photo = shrink(img, 1024);
    $("snap").hidden = true;
    $("review").hidden = false;
    $("result").className = "";
    $("result").textContent = "";
  } catch {
    $("result").className = "no";
    $("result").textContent = "That photo couldn't be read. Try again.";
  }
}

$("cam").addEventListener("change", takePhoto);
$("retake").addEventListener("change", takePhoto);

$("send").addEventListener("click", async () => {
  if (!photo) return;
  $("send").disabled = true;
  $("send").textContent = "Sending";
  const t = Date.now();
  state.log.push(t);
  save(); render();
  const thumb = await new Promise(r => shrink(photo, 600).toBlob(r, "image/jpeg", 0.75));
  await savePhoto(t, thumb);
  renderHistory();
  const ok = await notify(photo);
  $("result").className = ok ? "ok" : "no";
  $("result").textContent = ok ? nextSaying() : "Logged, but it didn't send. Check your signal.";
  photo = null;
  $("review").hidden = true;
  $("snap").hidden = false;
  $("send").disabled = false;
  $("send").textContent = "Send it 💧";
});

$("goal").addEventListener("change", e => {
  state.goal = Math.max(1, Math.min(20, parseInt(e.target.value) || 8));
  save(); render();
});
$("undo").addEventListener("click", () => {
  if (!todays().length) return;
  const t = state.log.pop(); save(); render();
  deletePhoto(t).then(renderHistory);
});

render();
renderHistory();
</script>
</body>
</html>
