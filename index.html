<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sip Check">
<title>Sip Check</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#3FA7D6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --lake: #0E3B5C; --water: #3FA7D6; --mist: #EAF5FB; --glass: #FFFFFF;
    --pebble: #5E6E79; --ok: #1F8A5B; --warn: #B4542C;
    --bg: var(--mist); --ink: var(--lake); --card: var(--glass);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #081C2B; --ink: #DCEFF9; --card: #0F2A3F; --pebble: #8FA3B0; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 420px; margin: 0 auto; padding: 20px 22px 40px; }
  h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0 0; }
  .sub { color: var(--pebble); margin: 4px 0 18px; }

  .glass-wrap { display: flex; align-items: flex-end; gap: 18px; margin: 10px 0 22px; }
  svg.glass { width: 130px; height: 170px; flex: none; }
  .count { font-size: 3.6rem; font-weight: 800; line-height: 1; }
  .count small { font-size: 1.2rem; color: var(--pebble); font-weight: 500; }
  #water { transition: y .8s ease, height .8s ease; }

  .snap {
    display: block; text-align: center; background: var(--water); color: #fff;
    font-size: 1.25rem; font-weight: 800; padding: 18px; border-radius: 999px;
    cursor: pointer; user-select: none;
  }
  .snap.alt { background: transparent; color: var(--water); border: 3px solid var(--water); margin-top: 12px; padding: 15px; }
  .snap.off { opacity: .45; pointer-events: none; }
  .snap:focus-within { outline: 3px solid var(--ink); outline-offset: 3px; }
  #result { min-height: 1.5em; margin: 14px 4px; font-weight: 500; font-size: 1.15rem; text-align: center; }
  #result.ok { color: var(--ok); } #result.no { color: var(--warn); }
  #preview { width: 100%; border-radius: 14px; display: block; margin-bottom: 12px; }
  button.snap { width: 100%; border: 0; font-family: inherit; }

  .stats { display: flex; gap: 12px; margin: 8px 0 20px; }
  .stats div { flex: 1; background: var(--card); border-radius: 14px; padding: 14px; }
  .stats b { display: block; font-size: 1.5rem; }
  .stats span { color: var(--pebble); font-size: .9rem; }

  ul { list-style: none; padding: 0; margin: 0 0 20px; color: var(--pebble); }
  li { padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--pebble) 25%, transparent); }
  h2 { font-size: 1.4rem; margin: 26px 0 6px; }
  h3 { font-size: 1rem; font-weight: 500; color: var(--pebble); margin: 16px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid button { position: relative; padding: 0; border: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--card); cursor: pointer; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid span { position: absolute; left: 6px; bottom: 5px; font: 500 .75rem inherit; color: #fff; text-shadow: 0 1px 3px #000a; }
  #history { margin-bottom: 24px; }
  #viewer { position: fixed; inset: 0; background: #000e; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; cursor: pointer; }
  #viewer img { max-width: 100%; max-height: 80%; border-radius: 14px; }
  #viewer p { color: #fff; margin-top: 12px; }
  #party { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; overflow: hidden; cursor: pointer;
    background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--water) 55%, var(--bg)), var(--bg) 75%);
    animation: fadeIn .25s ease-out; }
  #party.out { animation: fadeOut .35s ease-in forwards; }
  #star { width: 180px; height: 200px; display: flex; align-items: center; justify-content: center; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  #star img { max-width: 240px; max-height: 240px; border-radius: 18px; }
  #star svg { width: 150px; animation: hop .55s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  #partyText { font-size: 1.6rem; font-weight: 800; line-height: 1.25; max-width: 340px; margin: 26px 0 8px; animation: rise .5s .15s ease-out both; }
  #partyHint { color: var(--pebble); font-size: .85rem; margin: 0; }
  #rain span { position: absolute; top: -10vh; font-size: 1.8rem; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(120vh) rotate(var(--spin)); } }
  @keyframes hop { from { transform: translateY(0) scale(1.06, .94); } to { transform: translateY(-26px) scale(.96, 1.05); } }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #party *, #party { animation: none !important; } #rain { display: none; } }
  details { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  summary { cursor: pointer; font-weight: 500; }
  label.row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  select { font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--pebble); background: transparent; color: var(--ink); }
  input[type=checkbox] { width: 22px; height: 22px; }
  input[type=number] { width: 70px; font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--pebble); background: transparent; color: var(--ink); }
  button.link { background: none; border: 0; color: var(--warn); font: inherit; padding: 12px 0 0; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Sip Check</h1>
  <p class="sub" id="date"></p>

  <div class="glass-wrap">
    <svg class="glass" viewBox="0 0 130 170" aria-hidden="true">
      <defs><clipPath id="cup"><path d="M12 8 H118 L104 162 H26 Z"/></clipPath></defs>
      <rect id="water" x="0" y="170" width="130" height="0" fill="var(--water)" clip-path="url(#cup)"/>
      <path d="M12 8 H118 L104 162 H26 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="count"><span id="today">0</span><small> / <span id="goalShow">8</span></small></div>
      <div class="sub" style="margin:6px 0 0">drinks today</div>
    </div>
  </div>

  <label class="snap" id="snap">
    📸 Snap your water
    <input type="file" accept="image/*" capture="environment" id="cam" hidden>
  </label>

  <div id="review" hidden>
    <img id="preview" alt="Your photo">
    <button class="snap" id="send">Send it 💧</button>
    <label class="snap alt">
      Retake
      <input type="file" accept="image/*" capture="environment" id="retake" hidden>
    </label>
  </div>
  <p id="result" role="status"></p>

  <div class="stats">
    <div><b id="streak">0</b><span>day streak</span></div>
    <div><b id="last">None yet</b><span>last drink</span></div>
  </div>

  <p class="sub" id="nextRemind" style="text-align:center"></p>
  <button class="snap alt" id="pushBtn" hidden>🔔 Turn on reminders</button>
  <p class="sub" id="pushNote" style="text-align:center" hidden></p>

  <section id="history">
    <h2>History</h2>
    <div id="days"><p class="sub">Your photos will show up here.</p></div>
  </section>

  <div id="party" hidden>
    <div id="rain" aria-hidden="true"></div>
    <div id="star"></div>
    <p id="partyText"></p>
    <p id="partyHint">Tap anywhere to close</p>
  </div>

  <div id="viewer" hidden>
    <img id="big" alt="">
    <p id="bigTime"></p>
  </div>

  <details>
    <summary>Settings</summary>
    <label class="row">Daily goal (drinks)
      <input type="number" id="goal" min="1" max="20">
    </label>
    <label class="row">Reminders
      <input type="checkbox" id="rOn">
    </label>
    <label class="row">Remind me every
      <select id="rEvery"><option value="60">1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option><option value="180">3 hours</option></select>
    </label>
    <label class="row">I wake up at
      <select id="rWake"></select>
    </label>
    <label class="row">I go to bed at
      <select id="rSleep"></select>
    </label>
    <button class="link" id="undo">Remove last drink</button>
  </details>
</main>

<script>
// ===== EDIT THESE =====
const NTFY_TOPIC = "sipcheck-romaan-k82mz"; // make this random, it works like a password
const FRIEND_NAME = "Saira";                       // shows up in your notification
const SEND_PHOTO = true;                        // false = text only, no photo attached
const WORKER_URL = "https://sipcheck.pomegranate692.workers.dev";   // from Cloudflare, like https://sipcheck.yourname.workers.dev
const APP_KEY = "NTmxYglJBzcU7e2rZrPlMJI3";
const VAPID_PUBLIC = "BEf3pX7erDQYSz1fyJGDx51gGf5K40lzkukwU2x3dpgxYZtphbtklWMsb3wBTcRwrVILg5Vk4ICA8xiIGmYG-N4";
// ======================

const KEY = "sipcheck.v1";
const $ = id => document.getElementById(id);

let state = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { goal: 8, log: [] }; }
  catch { return { goal: 8, log: [] }; }
}
function save() {
  const cutoff = Date.now() - 60 * 864e5; // keep 60 days
  state.log = state.log.filter(t => t > cutoff);
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

const dayKey = t => new Date(t).toLocaleDateString("en-CA");
const timeStr = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const todays = () => state.log.filter(t => dayKey(t) === dayKey(Date.now()));

function streak() {
  const counts = {};
  state.log.forEach(t => { const k = dayKey(t); counts[k] = (counts[k] || 0) + 1; });
  const d = new Date();
  if ((counts[dayKey(d)] || 0) < state.goal) d.setDate(d.getDate() - 1); // today still in progress
  let s = 0;
  while ((counts[dayKey(d)] || 0) >= state.goal) { s++; d.setDate(d.getDate() - 1); }
  return s;
}

function render() {
  const t = todays();
  $("date").textContent = new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  $("today").textContent = t.length;
  $("goalShow").textContent = state.goal;
  $("goal").value = state.goal;
  $("streak").textContent = streak();
  $("last").textContent = t.length ? timeStr(t[t.length - 1]) : "None yet";

  const fill = Math.min(t.length / state.goal, 1) * 154; // 154 = inside height of the glass
  $("water").setAttribute("y", 162 - fill);
  $("water").setAttribute("height", fill);
}

function shrink(img, max = 640) {
  const scale = Math.min(1, max / Math.max((img.naturalWidth || img.width), (img.naturalHeight || img.height)));
  const c = document.createElement("canvas");
  c.width = Math.round((img.naturalWidth || img.width) * scale);
  c.height = Math.round((img.naturalHeight || img.height) * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}

async function notify(canvas) {
  const n = todays().length;
  const headers = {
    "Title": "Sip Check",
    "Message": `${FRIEND_NAME} logged drink ${n} of ${state.goal} at ${timeStr(Date.now())}`,
    "Tags": "droplet"
  };
  try {
    if (SEND_PHOTO) {
      const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.7));
      headers["Filename"] = "water.jpg";
      await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, { method: "PUT", body: blob, headers });
    } else {
      await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, { method: "POST", body: headers.Message, headers: { Title: headers.Title, Tags: headers.Tags } });
    }
    return true;
  } catch { return false; }
}

const SAYINGS = [
  "Hydration station: fully operational 🚰💧✅",
  "Your kidneys just sent you a thank you card 💌🫶",
  "Look at you, thriving like a well watered houseplant 🪴🌞",
  "Certified hydrated 📜✅ The Hydro Flask is proud 🥹",
  "One sip closer to glowing ✨🌟💧",
  "Your cells are doing a little happy dance right now 💃🕺🎶",
  "Water you doing? 🤔 Winning, apparently 🏆",
  "Absolute legend behavior 😤🔥",
  "Somewhere out there, a camel is jealous 🐪😒",
  "Hydrated and dangerous 😎💦",
  "You're making every other water bottle look bad 💅🥤",
  "Sip sip hooray! 🎉🥳🎊",
  "Your skin just whispered thank you ✨🧴😌",
  "Main character hydration arc 🎬🌊 Keep it going",
  "The ocean called 📞🌊 It says you're doing amazing",
  "Keep this up and you'll turn into a mermaid 🧜‍♀️🐚",
  "That's the good stuff 😋 Literally, it's water 💧",
  "H2Oh yeah 😏💦",
  "Plants wish they had your discipline 🌱👀",
  "Level up! +10 hydration 🎮⬆️💧",
  "Future you is high fiving you right now 🙌⏳",
  "Hydration queen, as usual 👑💧✨",
  "Another one! 🔁 Don't let that streak dry up 🔥",
  "Not all heroes wear capes 🦸‍♀️ Some carry Hydro Flasks 💪",
  "Drip check: passed 💧✅😎",
  "You're on a roll 🌀 A wet, healthy roll 💦",
  "Your brain just got a tiny bit sharper 🧠⚡ That's science 🔬",
  "Dehydration could never 🙅‍♀️🏜️",
  "Olympic level water drinking 🥇🏊‍♀️",
  "Moisturized. Unbothered. Iconic. 💅💧👑"
];

// OPTIONAL: paste GIF links here and one shows up at random on each send.
// On giphy.com: open a GIF, tap Share, then "Copy GIF Link". Example format:
// "https://media.giphy.com/media/XXXXXXXX/giphy.gif",
// Leave it empty to use the dancing water drop instead.
const GIFS = [
];
let bag = [];
function nextSaying() {
  if (!bag.length) bag = SAYINGS.map((_, i) => i).sort(() => Math.random() - 0.5); // no repeats until all 30 are used
  return SAYINGS[bag.pop()];
}

// the dancing water drop, with a random outfit each time
function dropSVG() {
  const face = `
    <circle cx="44" cy="98" r="6" fill="#0E3B5C"/><circle cx="76" cy="98" r="6" fill="#0E3B5C"/>
    <circle cx="46" cy="96" r="2" fill="#fff"/><circle cx="78" cy="96" r="2" fill="#fff"/>`;
  const extras = [
    face,
    `<rect x="30" y="88" width="26" height="16" rx="6" fill="#111"/><rect x="64" y="88" width="26" height="16" rx="6" fill="#111"/><rect x="54" y="92" width="12" height="4" fill="#111"/>`,
    `<text x="44" y="106" font-size="20" text-anchor="middle">❤️</text><text x="76" y="106" font-size="20" text-anchor="middle">❤️</text>`,
    face + `<text x="60" y="26" font-size="34" text-anchor="middle">👑</text>`,
    face + `<text x="60" y="24" font-size="32" text-anchor="middle">🥳</text>`,
    `<text x="44" y="106" font-size="20" text-anchor="middle">⭐</text><text x="76" y="106" font-size="20" text-anchor="middle">⭐</text>`
  ];
  const pick = extras[Math.floor(Math.random() * extras.length)];
  return `<svg viewBox="0 0 120 150" aria-hidden="true">
    <path d="M60 8 C60 8 14 66 14 98 a46 46 0 0 0 92 0 C106 66 60 8 60 8Z" fill="#3FA7D6" stroke="#0E3B5C" stroke-width="4"/>
    <ellipse cx="36" cy="80" rx="7" ry="14" fill="#fff" opacity=".45"/>
    <circle cx="34" cy="116" r="6" fill="#FF8FAB" opacity=".7"/><circle cx="86" cy="116" r="6" fill="#FF8FAB" opacity=".7"/>
    <path d="M46 116 Q60 132 74 116" fill="none" stroke="#0E3B5C" stroke-width="4" stroke-linecap="round"/>
    ${pick}
  </svg>`;
}

let partyTimer = null;
function celebrate(text) {
  const party = $("party");
  const star = $("star");
  if (GIFS.length) {
    star.innerHTML = `<img src="${GIFS[Math.floor(Math.random() * GIFS.length)]}" alt="">`;
    star.querySelector("img").onerror = () => star.innerHTML = dropSVG(); // bad link? show the drop
  } else {
    star.innerHTML = dropSVG();
  }
  $("partyText").textContent = text;

  const rain = $("rain");
  rain.innerHTML = "";
  const bits = ["💧", "💦", "✨", "🎉", "💙", "🫧"];
  for (let i = 0; i < 36; i++) {
    const b = document.createElement("span");
    b.textContent = bits[i % bits.length];
    b.style.left = Math.random() * 100 + "vw";
    b.style.animationDuration = 2 + Math.random() * 2 + "s";
    b.style.animationDelay = Math.random() * 1.2 + "s";
    b.style.setProperty("--spin", (Math.random() * 720 - 360) + "deg");
    rain.appendChild(b);
  }

  party.classList.remove("out");
  party.hidden = false;
  clearTimeout(partyTimer);
  partyTimer = setTimeout(closeParty, 4500);
}
function closeParty() {
  const party = $("party");
  if (party.hidden) return;
  party.classList.add("out");
  setTimeout(() => { party.hidden = true; party.classList.remove("out"); }, 350);
}
$("party").addEventListener("click", closeParty);

// ===== reminders =====
// Each drink reschedules the SAME 4 ntfy messages (same IDs), so old ones get replaced, never doubled up.
// nudge-1: every X after her last drink, nudge-2 and 3: follow ups if she ignores it, morning: next wake up
const R_DEFAULT = { on: true, every: 90, wake: 8, sleep: 22 };
const R = () => (state.remind ||= { ...R_DEFAULT });

const NUDGES = [
  ["Sip time 💧", "Grab the Hydro Flask and open Sip Check 🥤✨"],
  ["Still waiting on that sip 👀💧", "Your water misses you. Open Sip Check 🥺"],
  ["Last call for this round 🚰", "Your kidneys are asking nicely 🙏💙"],
  ["Good morning ☀️💧", "Start the day with some water. Open Sip Check 🌅"]
];

function isQuiet(t) {
  const d = new Date(t), h = d.getHours() + d.getMinutes() / 60, r = R();
  return r.sleep > r.wake ? (h >= r.sleep || h < r.wake) : (h >= r.sleep && h < r.wake);
}
function nextWake(after) {
  const d = new Date(after);
  d.setHours(R().wake, 0, 0, 0);
  if (d.getTime() <= after) d.setDate(d.getDate() + 1);
  return d.getTime();
}

const post = (path, data) => fetch(WORKER_URL + path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ key: APP_KEY, ...data })
});

async function scheduleReminders() {
  const r = R();
  const times = [];
  if (r.on) {
    const now = Date.now();
    let t1 = now + r.every * 60000;
    if (isQuiet(t1)) t1 = nextWake(t1);
    const t2 = t1 + 45 * 60000;
    const t3 = t2 + 60 * 60000;
    times.push({ t: t1, title: NUDGES[0][0], body: NUDGES[0][1] });
    let last = t1;
    if (!isQuiet(t2)) { times.push({ t: t2, title: NUDGES[1][0], body: NUDGES[1][1] }); last = t2; }
    if (!isQuiet(t2) && !isQuiet(t3)) { times.push({ t: t3, title: NUDGES[2][0], body: NUDGES[2][1] }); last = t3; }
    const m = nextWake(last + 60000); // safety net so the chain never dies
    times.push({ t: m, title: NUDGES[3][0], body: NUDGES[3][1] });
    state.nextAt = t1;
  } else {
    state.nextAt = null;
  }
  save(); showNext();
  if (state.pushOn) { try { await post("/schedule", { times }); } catch {} }
}

// ===== phone notifications (Web Push) =====
const b64uToBytes = str => {
  const s = str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4);
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
};
const isHomeScreenApp = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

function showPushUI() {
  const btn = $("pushBtn"), note = $("pushNote");
  btn.hidden = true; note.hidden = true;
  if (state.pushOn && Notification.permission === "granted") return;
  if (!isHomeScreenApp()) { note.hidden = false; note.textContent = "📲 Open Sip Check from your home screen icon to turn on reminders"; return; }
  if (!pushSupported()) { note.hidden = false; note.textContent = "Update your iPhone to turn on reminders"; return; }
  btn.hidden = false;
}

async function enablePush() {
  const btn = $("pushBtn");
  btn.disabled = true; btn.textContent = "Turning on";
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("Notifications are blocked. Turn them on in iPhone Settings, then Notifications, then Sip Check.");
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(VAPID_PUBLIC) });
    const res = await post("/subscribe", { sub: sub.toJSON() });
    if (!res.ok) throw new Error("Couldn't reach the reminder server.");
    state.pushOn = true; save();
    await scheduleReminders();
    post("/test", {}).catch(() => {});
    $("result").className = "ok";
    $("result").textContent = "Reminders are on 🔔 A test one is on its way!";
  } catch (err) {
    $("result").className = "no";
    $("result").textContent = err.message || "Something went wrong. Try again.";
  }
  btn.disabled = false; btn.textContent = "🔔 Turn on reminders";
  showPushUI();
}

// keeps the server's copy of the subscription fresh every time she opens the app
async function refreshPush() {
  if (!state.pushOn || !pushSupported() || Notification.permission !== "granted") return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) post("/subscribe", { sub: sub.toJSON() });
    else { state.pushOn = false; save(); showPushUI(); }
  } catch {}
}

function showNext() {
  const el = $("nextRemind");
  if (!state.pushOn) { el.textContent = ""; return; }
  if (!R().on) { el.textContent = "Reminders are off"; return; }
  if (!state.nextAt || state.nextAt < Date.now()) { el.textContent = "⏰ Log a drink to start your reminders"; return; }
  const d = new Date(state.nextAt);
  const sameDay = dayKey(d) === dayKey(Date.now());
  el.textContent = `⏰ Next reminder ${sameDay ? "" : "tomorrow "}at ${timeStr(d)}`;
}

function hourOptions(sel, val) {
  sel.innerHTML = "";
  for (let h = 0; h < 24; h++) {
    const o = document.createElement("option");
    o.value = h;
    o.textContent = new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: "numeric" });
    if (h === val) o.selected = true;
    sel.appendChild(o);
  }
}
function setupReminderSettings() {
  const r = R();
  $("rOn").checked = r.on;
  $("rEvery").value = String(r.every);
  hourOptions($("rWake"), r.wake);
  hourOptions($("rSleep"), r.sleep);
  const changed = () => {
    r.on = $("rOn").checked;
    r.every = parseInt($("rEvery").value);
    r.wake = parseInt($("rWake").value);
    r.sleep = parseInt($("rSleep").value);
    save();
    scheduleReminders();
  };
  ["rOn", "rEvery", "rWake", "rSleep"].forEach(id => $(id).addEventListener("change", changed));
  showNext();
}

let photo = null;

// photos live in IndexedDB on her phone (too big for localStorage)
const dbReady = new Promise((res, rej) => {
  const r = indexedDB.open("sipcheck", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "t" });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function tx(mode, fn) {
  const db = await dbReady;
  return new Promise((res, rej) => {
    const t = db.transaction("photos", mode);
    const out = fn(t.objectStore("photos"));
    t.oncomplete = () => res(out && out.result);
    t.onerror = () => rej(t.error);
  });
}
const savePhoto = (t, blob) => tx("readwrite", st => st.put({ t, blob })).catch(() => {});
const deletePhoto = t => tx("readwrite", st => st.delete(t)).catch(() => {});
const allPhotos = () => tx("readonly", st => st.getAll()).catch(() => []);

let urls = [];
async function renderHistory() {
  const photos = (await allPhotos()) || [];
  urls.forEach(u => URL.revokeObjectURL(u)); urls = [];
  if (!photos.length) return;
  photos.sort((a, b) => b.t - a.t);
  const byDay = {};
  photos.forEach(p => (byDay[dayKey(p.t)] ||= []).push(p));
  const box = $("days");
  box.innerHTML = "";
  for (const k of Object.keys(byDay)) {
    const h = document.createElement("h3");
    h.textContent = new Date(byDay[k][0].t).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }) + `  (${byDay[k].length})`;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const p of byDay[k]) {
      const u = URL.createObjectURL(p.blob); urls.push(u);
      const b = document.createElement("button");
      b.innerHTML = `<img src="${u}" alt="Drink at ${timeStr(p.t)}"><span>${timeStr(p.t)}</span>`;
      b.onclick = () => {
        $("big").src = u;
        $("bigTime").textContent = new Date(p.t).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
        $("viewer").hidden = false;
      };
      grid.appendChild(b);
    }
    box.append(h, grid);
  }
}
$("viewer").addEventListener("click", () => $("viewer").hidden = true);

async function takePhoto(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const img = $("preview");
  img.src = URL.createObjectURL(file);
  try {
    await img.decode();
    photo = shrink(img, 1024);
    $("snap").hidden = true;
    $("review").hidden = false;
    $("result").className = "";
    $("result").textContent = "";
  } catch {
    $("result").className = "no";
    $("result").textContent = "That photo couldn't be read. Try again.";
  }
}

$("cam").addEventListener("change", takePhoto);
$("retake").addEventListener("change", takePhoto);

$("send").addEventListener("click", async () => {
  if (!photo) return;
  $("send").disabled = true;
  $("send").textContent = "Sending";
  const t = Date.now();
  state.log.push(t);
  save(); render();
  const thumb = await new Promise(r => shrink(photo, 600).toBlob(r, "image/jpeg", 0.75));
  await savePhoto(t, thumb);
  renderHistory();
  const ok = await notify(photo);
  scheduleReminders();
  $("result").className = ok ? "ok" : "no";
  const line = todays().length === state.goal ? "DAILY GOAL SMASHED 🏆🎉💧 You did it!" : nextSaying();
  $("result").textContent = ok ? line : "Logged, but it didn't send. Check your signal.";
  if (ok) celebrate(line);
  photo = null;
  $("review").hidden = true;
  $("snap").hidden = false;
  $("send").disabled = false;
  $("send").textContent = "Send it 💧";
});

$("goal").addEventListener("change", e => {
  state.goal = Math.max(1, Math.min(20, parseInt(e.target.value) || 8));
  save(); render();
});
$("undo").addEventListener("click", () => {
  if (!todays().length) return;
  const t = state.log.pop(); save(); render();
  deletePhoto(t).then(renderHistory);
});

render();
renderHistory();
setupReminderSettings();
setInterval(showNext, 60000);
$("pushBtn").addEventListener("click", enablePush);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
showPushUI();
refreshPush();
</script>
</body>
</html>
